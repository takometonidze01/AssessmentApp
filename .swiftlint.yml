disabled_rules:
  - switch_case_alignment
  - inclusive_language
  - todo
  - superfluous_disable_command
  - comment_spacing
  - nesting
  - empty_parentheses_with_trailing_closure
  - generic_type_name
  - non_optional_string_data_conversion

opt_in_rules:
  - empty_count
  - toggle_bool
  - empty_string
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - last_where
  - let_var_whitespace
  - private_outlet
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - untyped_error_in_catch
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - yoda_condition
  - explicit_init
  - extension_access_modifier
  - fallthrough
  - fatal_error_message
  - indentation_width
  - literal_expression_end_indentation
  - attributes
  - conditional_returns_on_newline
  - file_name_no_space

included:
  - AssessmentApp
  - Domain
  - Networking
  - Presentation
  - DesignSystem
  - Core

excluded:
  - ./*/.build
  - ./*/build
  - Pods

analyzer_rules:
  - explicit_self
  - unused_declaration
  - unused_import

attributes:
  always_on_same_line: ["@IBAction", "@IBSegueAction", "@NSManaged", "@discardableResult", "@escaping", "@objc"]

custom_rules:
  force_https:
    name: "Force HTTPS over HTTP"
    regex: "((?i)http(?!s))"
    match_kinds: string
    message: "HTTPS should be favored over HTTP"
    severity: warning

force_cast: warning

force_try:
  severity: warning

line_length: 180

type_body_length:
  - 600
  - 800

file_length:
  warning: 1000
  error: 1200

type_name:
  min_length: 2
  max_length:
    warning: 60
    error: 70
  excluded: iPhone
  allowed_symbols: ["_"]

reporter: "xcode"

indentation_width:
  indentation_width: 2
  include_comments: false

conditional_returns_on_newline:
  if_only: true
